<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#B08A58"><title>Configuração inicial | Casal Pet Sitter</title><link rel="stylesheet" href="/styles.css"></head><body class="auth-page"><main class="auth-shell"><a class="back-link" href="/">← Voltar ao site</a><section class="auth-card"><div class="brand-logo big">🐾</div><div class="eyebrow">Configuração inicial</div><h1>Criar acessos administrativos</h1><p>Esta etapa funciona apenas uma vez. Depois de criar os acessos, esta página é bloqueada.</p><form id="setupForm"><label>Código de configuração<input name="setupToken" type="password" required autocomplete="off"></label><label>Senha do Luan<input name="luanPassword" type="password" minlength="10" required autocomplete="new-password"></label><label>Senha da Isabela<input name="isabelaPassword" type="password" minlength="10" required autocomplete="new-password"></label><button class="btn btn-primary btn-wide" type="submit">Criar acessos</button><div id="setupMessage" class="form-message"></div></form></section></main><script src="/setup.js" defer></script></body></html>
